# idle-loop — agentic CI/CD.
#
# Two triggers:
#   * workflow_dispatch — run it by hand from the Actions tab, choosing whether
#     to act for real and how many tickets to take.
#   * schedule — a nightly pass that DEFAULTS TO --dry-run for safety, so an
#     unattended run never merges anything on its own.
#
# Secrets required (repo or org level):
#   ANTHROPIC_API_KEY  — the coding/review agents
#   GH_TOKEN           — issues/PRs/labels/merges (a PAT, or pass the built-in
#                        GITHUB_TOKEN; note the built-in token cannot trigger
#                        further workflows on the PRs it opens).
name: idle-loop

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List + estimate only, take no action"
        type: boolean
        default: true
      max_tickets:
        description: "Process at most N tickets (blank = unlimited)"
        type: string
        required: false

  schedule:
    # 03:00 UTC nightly. Scheduled runs are dry-run only (see the run step).
    - cron: "0 3 * * *"

# The loop opens PRs, comments, and manages labels.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: idle-loop
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run idle-loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # Scheduled runs are always dry-run; manual runs honor the input.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DRY="--dry-run"
          elif [ "${{ inputs.dry_run }}" = "false" ]; then
            DRY=""
          else
            DRY="--dry-run"
          fi

          MAX=""
          if [ -n "${{ inputs.max_tickets }}" ]; then
            MAX="--max-tickets ${{ inputs.max_tickets }}"
          fi

          echo "Running: python idle_loop.py $DRY $MAX"
          python idle_loop.py $DRY $MAX
