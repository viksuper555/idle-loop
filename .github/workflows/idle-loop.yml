# idle-loop — agentic CI/CD.
#
# The agents run through the Claude Code harness (the `claude` CLI), which is
# authenticated by a Claude login — NOT an API key. That login isn't available
# in a default GitHub Actions runner, so:
#   * schedule — a nightly **dry-run** (estimator + GitHub only; never invokes
#     the harness), so it's a safe, auth-free "what would the loop cost tonight?"
#     report.
#   * workflow_dispatch — manual; a real (non-dry-run) pass needs Claude Code
#     installed AND authenticated on the runner (e.g. a self-hosted runner that
#     has run `claude` /login, or a CLAUDE_CODE_OAUTH_TOKEN your setup injects).
#
# For real unattended runs, the intended path is the LOCAL listener + cron
# (./idle-listener.sh), which uses your existing Claude login and reschedules
# itself across rate limits. See the README.
#
# Secret used here:
#   GH_TOKEN — issues/PRs/labels/merges (a PAT, or the built-in GITHUB_TOKEN;
#              note the built-in token cannot trigger further workflows on the
#              PRs it opens).
name: idle-loop

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List + estimate only, take no action"
        type: boolean
        default: true
      max_tickets:
        description: "Process at most N tickets (blank = unlimited)"
        type: string
        required: false

  schedule:
    # 03:00 UTC nightly. Scheduled runs are dry-run only (see the run step).
    - cron: "0 3 * * *"

# The loop opens PRs, comments, and manages labels.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: idle-loop
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run idle-loop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # Scheduled runs are always dry-run; manual runs honor the input.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DRY="--dry-run"
          elif [ "${{ inputs.dry_run }}" = "false" ]; then
            DRY=""
          else
            DRY="--dry-run"
          fi

          if [ -z "$DRY" ] && ! command -v claude >/dev/null; then
            echo "::error::A real run needs the Claude Code harness (claude) installed and"
            echo "::error::authenticated on this runner. Use --dry-run here, or run the local"
            echo "::error::listener (./idle-listener.sh). See the README."
            exit 1
          fi

          MAX=""
          if [ -n "${{ inputs.max_tickets }}" ]; then
            MAX="--max-tickets ${{ inputs.max_tickets }}"
          fi

          echo "Running: python idle_loop.py $DRY $MAX"
          python idle_loop.py $DRY $MAX
