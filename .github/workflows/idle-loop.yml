# idle-loop CI.
#
# The autonomous loop runs LOCALLY via ./idle-listener.sh — it needs the Claude
# Code harness (your `claude` login), which a GitHub runner doesn't have. So the
# only thing GitHub Actions is good for here is:
#   * test   — ruff + pytest on every push / PR (the suite is fully mocked, no
#              network, no claude).
#
# The idle:* labels are ensured by the loop itself on every `python idle_loop.py`
# run, or manually via `python idle_loop.py --ensure-labels` (token only).
name: idle-loop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest

  # Fail-closed safety net: a PR must never introduce a Claude session
  # transcript (*.jsonl / .claude/projects/) or idle-loop session-state file.
  # These are unscrubbed and may contain prompts, tool output and secrets.
  transcript-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base ref to diff the PR's changed files against it.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Block session-transcript / session-file leaks
        run: |
          set -euo pipefail
          BASE="${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "$BASE"
          # The PR's changed-file set, against the base branch — not the whole tree.
          git diff --name-only "origin/${BASE}...HEAD" \
            | python -m guards.transcript_leak
