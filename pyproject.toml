[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idle-loop"
version = "0.1.0"
description = "The guard-railed autonomous coding loop you can actually walk away from."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Idle" }]
dependencies = [
    "anthropic>=0.40",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
]
learned = [
    "scikit-learn>=1.3",
    "numpy>=1.26",
]

[project.scripts]
idle-loop = "idle_loop:main"

# Flat layout: top-level modules (idle_loop.py, models.py, ...) plus the
# agents/ and guards/ packages, exactly as laid out in the spec (§10).
[tool.setuptools]
py-modules = ["idle_loop", "models", "config", "github_client", "costlog"]
packages = ["agents", "guards"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]  # long lines tolerated; formatter governs width

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true
# Pragmatic for a v1: don't require annotations everywhere, but check what's typed.
